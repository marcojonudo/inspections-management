<div
	role="group"
	class="separator-input-container"
	[formGroup]="formGroup"
	(focusin)="onFocusIn()"
	(focusout)="onFocusOut($event)">
	<div *ngFor="let field of fields | order; let i = index; let last = last" class="separator-field-wrapper">
		<span *ngIf="field.prefix" matPrefix class="separator-input-spacer">{{field.prefix}}</span>
		<mat-select
			*ngIf="field.select; else textInput"
			class="mat-select"
			formControlName="field-{{i}}"
			(selectionChange)="updateSelect()">
			<mat-option
				*ngFor="let option of field.values | order"
				[value]="option.value"
				class="mat-option">
				{{option.value}}
			</mat-option>
		</mat-select>
		<ng-template #textInput>
			<input
				[type]="field.inputType"
				class="separator-input-element"
				formControlName="field-{{i}}"
				[maxLength]="findMaxLength(field)"
				(input)="handleInput(i)"
				(keyup.backspace)="handleAutoFocusPrev(i)"
				#fieldInput>
		</ng-template>
		<span *ngIf="!last" class="separator-input-spacer">{{field.separator}}</span>
	</div>
</div>
