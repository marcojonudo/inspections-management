<div id="sheet-container">
	<img src="assets/img/backgrounds/{{vehicleType.backgroundImage}}.jpg" class="vehicle-background-image"/>
	<div *ngFor="let cat of categories; let i = index" class="category">
		<div class="card" *ngIf="cat.category; else elementTemplate">
			<div class="card-header">
				<mat-icon mat-card-avatar>navigate_next</mat-icon>
				<div>{{cat.category.name}}</div>
			</div>
			<div class="card-content">
				<ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: cat }"></ng-container>
			</div>
		</div>
		<ng-template #elementTemplate>
			<div class="card text-area-card">
				<div class="card-header">
					<mat-icon mat-card-avatar>navigate_next</mat-icon>
					<div [innerHTML]="cat.items[0].item.name"></div>
				</div>
				<div class="card-content">
					<div class="text-area-card-content">
						<div *ngFor="let line of findTextAreaLines(findTextAreaSavedItem(cat.items[0]))" class="highlight">{{line}}</div>
					</div>
					<mat-form-field>
						<textarea
							matInput
							cdkTextareaAutosize
							cdkAutosizeMinRows="1"
							cdkAutosizeMaxRows="5"
							[(ngModel)]="findTextAreaSavedItem(cat.items[0]).text"
							(change)="updateTextArea(findTextAreaSavedItem(cat.items[0]))">
						</textarea>
					</mat-form-field>
				</div>
			</div>
		</ng-template>
	</div>
	<ng-template #itemTemplate let-cat>
		<div class="items-info">
			<div *ngFor="let item of cat.items | printOrder" class="item" [class.highlight]="checkWrongItem(item)">
				<div
					*ngIf="checkItemType(item.item.type, selectType); else textItemText"
					matRipple
					(click)="toggleSelectOption(findSelectSavedItem(item))">
					<div class="item-text" [innerHTML]="item.item.name"></div>
					<div class="item-data">
						<mat-icon
							*ngFor="let option of findSelectItemOptions(item) | order; let i = index"
							class="select-item-icon"
							[ngClass]="{
								'front': checkSelectedOption(item.findValue(), option.code, item, i),
								'left': checkLeftOption(findSelectSavedItem(item), i),
								'right': checkRightOption(findSelectSavedItem(item), i)
							}"
							[style.color]="findIconColor(findSelectSavedItem(item).value)">
							{{option.printIcon}}
						</mat-icon>
					</div>
				</div>
				<ng-template #textItemText>
					<div class="text-item" [class.text-item-fields]="findTextSavedItem(item).fields.length > 2">
						<div class="item-text" [innerHTML]="item.item.name"></div>
						<mat-form-field>
							<span *ngIf="checkIndividualTextField(findTextItem(item))" matPrefix>
								{{findTextItemField(item).prefix}}
							</span>
							<ng-container *ngIf="checkIndividualTextField(findTextItem(item)); else separatorInput">
								<mat-select
									*ngIf="findTextItemField(item).select; else textInput"
									[(ngModel)]="findTextSavedItemField(item).text"
									(selectionChange)="updateText(findTextSavedItem(item))">
									<mat-option
										*ngFor="let option of findTextItemField(item).values | order"
										[value]="option.value">
										{{option.value}}
									</mat-option>
								</mat-select>
								<ng-template #textInput>
									<input
										matInput
										[type]="findTextItemField(item).inputType"
										[maxLength]="findTextItemFieldMaxLength(item)"
										[placeholder]="findTextItemField(item).placeholder"
										[(ngModel)]="findTextSavedItemField(item).text"
										(change)="updateText(findTextSavedItem(item))"
										autocomplete="off">
								</ng-template>
							</ng-container>
							<ng-template #separatorInput>
								<app-separator-input
									[fields]="findTextItem(item).fields"
									[model]="findTextSavedItem(item).fields"
									(valueEmitter)="updateSeparatorValue(item, $event)">
								</app-separator-input>
							</ng-template>
							<span matSuffix>{{findTextItemUnit(item)}}</span>
						</mat-form-field>
						<div class="item-data">
							<span class="item-text-value" [class.unit]="findTextItemUnit(item)">
								{{findTextSavedItem(item).isFilled() ? findTextSavedItem(item).findValue() : '-'}}
							</span>
							<span class="item-unit">{{findTextItemUnit(item)}}</span>
						</div>
					</div>
				</ng-template>
			</div>
		</div>
	</ng-template>
</div>
