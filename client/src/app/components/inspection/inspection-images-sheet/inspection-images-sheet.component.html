<img src="assets/img/backgrounds/{{vehicleType.backgroundImage}}.jpg" class="vehicle-background-image"/>
<div *ngFor="let cat of categories" class="category">
	<div class="card" *ngIf="cat.category; else elementTemplate">
		<div class="card-header">
			<mat-icon mat-card-avatar>navigate_next</mat-icon>
			<div translate>print.category.{{cat.category.code}}</div>
		</div>
		<div class="card-content">
			<div class="image-category-content">
				<div *ngFor="let item of cat.items | printOrder" class="image-item">
					<div translate>inspection.item.{{item.item.code}}</div>
					<div class="image-container">
						<img [src]="findImageUrl(item.imageId)">
					</div>
				</div>
			</div>
		</div>
	</div>
	<ng-template #elementTemplate>
		<div class="card">
			<div class="card-header">
				<mat-icon mat-card-avatar>navigate_next</mat-icon>
				<div translate>inspection.item.{{cat.items[0].item.code}}</div>
			</div>
			<div class="card-content">
				<div class="image-category-content">
					<div class="image-item" [class.span]="findImage(cat.items[0].imageId)?.landscape">
						<img [src]="findImageUrl(cat.items[0].imageId)" class="item-image">
					</div>
				</div>
			</div>
		</div>
	</ng-template>
</div>
