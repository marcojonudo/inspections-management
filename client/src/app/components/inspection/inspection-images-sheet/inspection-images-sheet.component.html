<img src="assets/img/backgrounds/{{vehicleType.backgroundImage}}.jpg" class="vehicle-background-image"/>
<div *ngFor="let cat of categories" class="category">
	<div class="card" *ngIf="cat.category; else elementTemplate">
		<div class="card-header">
			<mat-icon mat-card-avatar>navigate_next</mat-icon>
			<div>{{cat.category.name}}</div>
		</div>
		<div class="card-content">
			<div class="image-category-content">
				<div *ngFor="let item of cat.items | printOrder" class="image-item">
					<div [innerHTML]="item.item.name"></div>
					<div class="image-container">
						<img [src]="findImageUrl(item.findImageId())">
					</div>
				</div>
			</div>
		</div>
	</div>
	<ng-template #elementTemplate>
		<div class="card">
			<div class="card-header">
				<mat-icon mat-card-avatar>navigate_next</mat-icon>
				<div [innerHTML]="cat.items[0].item.name"></div>
			</div>
			<div class="card-content">
				<div class="image-category-content">
					<div class="image-item" [class.span]="findImage(cat.items[0].findImageId())?.landscape">
						<img [src]="findImageUrl(cat.items[0].findImageId())" class="item-image">
					</div>
				</div>
			</div>
		</div>
	</ng-template>
</div>
