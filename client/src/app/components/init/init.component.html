<mat-card>
	<mat-card-header class="custom-card-header">
		<mat-icon mat-card-avatar>account_circle</mat-icon>
		<mat-card-title translate>init.introduceEmployeeCode</mat-card-title>
	</mat-card-header>
	<mat-card-content>
		<mat-form-field>
			<mat-label translate>init.employeeCode</mat-label>
			<input
				matInput
				[type]="findEmployeeCodeInputType()"
				[placeholder]="findEmployeeCodePlaceholder()"
				[formControl]="employeeCode"
				[maxLength]="employeeCodeMaxLength"
				(keyup)="searchEmployee()"
				autocomplete="off">
			<mat-error *ngIf="employeeCode.invalid">{{getEmployeeCodeErrorMessage() | async}}</mat-error>
		</mat-form-field>
	</mat-card-content>
</mat-card>
